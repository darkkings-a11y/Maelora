name: Build Maelora APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Décompresser les zips éventuels
        run: |
          for z in *.zip; do
            [ -f "$z" ] && unzip -q -o "$z" -d "unzipped_${z%.zip}"
          done || true

      - name: Trouver la racine du projet Gradle
        run: |
          SETTINGS=$(find . -name 'settings.gradle*' -not -path '*/node_modules/*' | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "Aucun settings.gradle trouvé. Contenu du dépôt :"
            find . -maxdepth 3 -not -path './.git/*'
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> $GITHUB_ENV
          echo "Projet trouvé dans : $(dirname "$SETTINGS")"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compiler l'APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: maelora-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
