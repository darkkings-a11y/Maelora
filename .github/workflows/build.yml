name: Build Maelora APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Décompresser les zips éventuels
        run: |
          for z in *.zip; do
            [ -f "$z" ] && unzip -q -o "$z" -d "unzipped_${z%.zip}"
          done || true

      - name: Trouver la racine du projet Gradle
        run: |
          SETTINGS=$(find . -name 'settings.gradle*' -not -path '*/node_modules/*' | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "Aucun settings.gradle trouvé. Contenu du dépôt :"
            find . -maxdepth 3 -not -path './.git/*'
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> $GITHUB_ENV
          echo "Projet trouvé dans : $(dirname "$SETTINGS")"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compiler l'APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --console=plain --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Afficher les erreurs de compilation
        if: failure()
        run: |
          echo "===== Erreurs Kotlin / Gradle ====="
          grep -E '^e: |error:|Unresolved|What went wrong' -A2 "$GITHUB_WORKSPACE/build.log" | head -80 || true
          grep -E '^e: ' "$GITHUB_WORKSPACE/build.log" | head -20 | while read -r l; do echo "::error::$l"; done || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log

      - uses: actions/upload-artifact@v4
        with:
          name: maelora-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
